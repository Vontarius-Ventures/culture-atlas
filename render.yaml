# Render blueprint for the culture atlas demo (see docs/deploy.md).
# One Docker image runs both services. Secrets are `sync: false`: Render asks
# for them when the blueprint is applied; nothing secret lives in this file.
# Plan names change over time; check them against Render's current list.

databases:
  - name: culture-atlas-db
    databaseName: culture_atlas
    user: culture_atlas
    postgresMajorVersion: "16"
    plan: basic-256mb

envVarGroups:
  - name: culture-atlas-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Must be identical for web and worker; generated once by Render.
      - key: SESSION_SECRET
        generateValue: true
      # base64 of 32 random bytes (openssl rand -base64 32). Needed for World Sensor poll mode.
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      # Concentrate is NOT enabled by this blueprint. After qualification, set
      # LLM_PROVIDER=concentrate explicitly and configure the secret/profile and
      # spend assertions listed in docs/concentrate.md on the analysis worker.
      # Keep the Featherless secret for explicit rollback only, never fallback.
      # Leave empty until the hackathon key arrives: Qloo then reports "unavailable", never fake data.
      - key: QLOO_API_KEY
        sync: false
      - key: WIKIMEDIA_USER_AGENT
        sync: false
      # Web and worker run on separate machines, so media must live in shared S3-compatible storage.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      # Comma-separated relay origins the server may poll (https only in production). Usually empty: use the bridge.
      - key: SENSOR_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_INSPECTOR_ACCOUNT_IDS
        sync: false

services:
  - type: web
    name: culture-atlas-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /v1/health
    preDeployCommand: pnpm db:migrate
    envVars:
      - fromGroup: culture-atlas-shared
      - key: DATABASE_URL
        fromDatabase:
          name: culture-atlas-db
          property: connectionString
      # Public https URL of this service (cookies are Secure when it starts with https://).
      - key: APP_BASE_URL
        sync: false
      # Per-IP limits read the client address from the right end of X-Forwarded-For.
      # Render's proxy appends one hop; verify against Render's current docs (see docs/deploy.md).
      - key: TRUSTED_PROXY_HOPS
        value: "1"

  - type: worker
    name: culture-atlas-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: pnpm worker
    envVars:
      - fromGroup: culture-atlas-shared
      - key: DATABASE_URL
        fromDatabase:
          name: culture-atlas-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false

  # Capture v2 media worker: verification, ffmpeg preparation, frames, cleanup and
  # storage reconciliation. Without it uploads stay in "verifying" and video stays off.
  - type: worker
    name: culture-atlas-media-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: pnpm media-worker
    envVars:
      - fromGroup: culture-atlas-shared
      - key: DATABASE_URL
        fromDatabase:
          name: culture-atlas-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
