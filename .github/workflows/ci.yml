name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: culture_atlas
          POSTGRES_PASSWORD: culture_atlas
          POSTGRES_DB: culture_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U culture_atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each vitest run creates and drops its own database from this base URL.
      TEST_DATABASE_URL: postgres://culture_atlas:culture_atlas@localhost:5432/culture_atlas_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The media worker tests generate and decode real media with ffmpeg/ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit, integration and contract tests
        # No provider keys here: tests use fakes, fixtures and the mock relay.
        run: pnpm test

      - name: Migrations apply to a fresh database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://culture_atlas:culture_atlas@localhost:5432/culture_atlas_test

      - name: Build
        run: pnpm build
